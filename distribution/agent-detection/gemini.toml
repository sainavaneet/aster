id = "gemini"
version = "2026.10.29.1"
min_engine_version = 1
updated_at = "2026-10-29T00:00:00Z"

[[rules]]
id = "apply_or_allow_change"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["│ Apply this change"] },
  { contains = ["│ Allow execution"] },
  { all = [{ contains = ["yes"] }, { any = [{ contains = ["waiting for user confirmation"] }, { contains = ["│ Do you want to proceed"] }, { contains = ["do you want to proceed?"] }] }] },
  { line_regex = ['(?i)^\s*❯.*(yes|allow)'] },
]

[[rules]]
id = "esc_cancel_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["esc to cancel"]

# Gemini CLI 0.64 no longer prints "esc to cancel" while a tool or hook runs.
# It sets the window title to "✦  Working… (<dir>)" and shows a braille spinner
# line such as "⠋ Executing Hooks: …" near the composer. Both stay below the
# blocked rule (300) so an "Apply this change?" prompt still wins if the title
# has not changed yet.
[[rules]]
id = "osc_title_working"
state = "working"
priority = 250
region = "osc_title"
visible_working = true
regex = ['^\s*✦\s*Working']

[[rules]]
id = "spinner_line_working"
state = "working"
priority = 200
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^\s*[\x{2800}-\x{28FF}]\s+\S']
